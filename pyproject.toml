[project]
name = "second-brain"
version = "1.0.0"
description = "RAG-based personal knowledge assistant"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "supabase>=2.0.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.2.3",
    "pypdf>=6.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"